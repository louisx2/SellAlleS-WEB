# Corre scripts/optimizar-storage.mjs en los servidores de GitHub, para no
# depender de que alguien tenga Node, sharp y la service-role key a mano en su
# maquina. Nunca se ejecuta solo: hay que pedirlo, de una de las dos formas de
# abajo, porque el script escribe en Storage y en products.image de produccion.
name: Optimizar imagenes de Storage

on:
  # Via 1: el formulario de la pestana Actions.
  workflow_dispatch:
    inputs:
      fase:
        description: 'Que hacer'
        required: true
        type: choice
        default: huerfanas
        options:
          - huerfanas
          - recomprimir
      aplicar:
        description: 'Escribir de verdad (sin marcar = solo simulacro, no cambia nada)'
        required: false
        type: boolean
        default: false

  # Via 2: empujar a esta rama ejecuta lo que diga .github/optimizador.json.
  # Existe para poder lanzarlo con un commit, sin entrar a la pestana Actions.
  # Solo dispara en esta rama concreta, nunca en main.
  push:
    branches:
      - ejecutar-optimizacion

# Dos corridas a la vez se pisarian: la una borraria el original que la otra
# acaba de repuntar. Con esto la segunda espera.
concurrency:
  group: optimizar-storage
  cancel-in-progress: false

jobs:
  optimizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Sin la clave el script falla igual, pero con un mensaje mucho menos
      # claro y despues de haber instalado medio node_modules.
      - name: Comprobar que la clave esta configurada
        env:
          CLAVE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$CLAVE" ]; then
            echo "Falta el secret SUPABASE_SERVICE_ROLE_KEY."
            echo "Se anade en Settings -> Secrets and variables -> Actions -> New repository secret."
            exit 1
          fi
          echo "Clave presente."

      # De donde salen la fase y el modo depende de como se lanzo. El JSON es
      # texto del repositorio, asi que la fase se valida contra la lista blanca
      # antes de que llegue a la linea de comandos.
      - name: Decidir que ejecutar
        id: plan
        env:
          EVENTO: ${{ github.event_name }}
          FASE_INPUT: ${{ inputs.fase }}
          APLICAR_INPUT: ${{ inputs.aplicar }}
        run: |
          if [ "$EVENTO" = "workflow_dispatch" ]; then
            fase="$FASE_INPUT"
            aplicar="$APLICAR_INPUT"
          else
            fase=$(jq -r '.fase' .github/optimizador.json)
            aplicar=$(jq -r '.aplicar' .github/optimizador.json)
          fi
          case "$fase" in
            huerfanas|recomprimir) ;;
            *) echo "Fase no valida: '$fase'. Solo vale huerfanas o recomprimir."; exit 1 ;;
          esac
          [ "$aplicar" = "true" ] || aplicar=false
          echo "fase=$fase" >> "$GITHUB_OUTPUT"
          echo "aplicar=$aplicar" >> "$GITHUB_OUTPUT"
          echo "Lanzado por $EVENTO -> fase=$fase aplicar=$aplicar"

      - run: npm ci

      # sharp no esta en package.json a proposito: solo lo necesita este script.
      - run: npm i --no-save sharp

      - name: Ejecutar el script
        env:
          SUPABASE_URL: https://qwpjclqinruhtxgkrxwr.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FASE: ${{ steps.plan.outputs.fase }}
          APLICAR: ${{ steps.plan.outputs.aplicar }}
        run: |
          if [ "$APLICAR" = "true" ]; then
            echo "== $FASE (APLICANDO DE VERDAD) =="
            node scripts/optimizar-storage.mjs "$FASE" --aplicar
          else
            echo "== $FASE (simulacro: no se escribe nada) =="
            node scripts/optimizar-storage.mjs "$FASE"
          fi
